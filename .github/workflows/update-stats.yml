name: Update SOMBA stats

# Runs itself every hour and refreshes the numbers.
# Also runnable on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 past (top-of-hour is GitHub's busiest slot, so :00 runs get skipped more often)
  workflow_dispatch:

# Let the built-in token commit the updated data back to the repo,
# and open an alert issue when something breaks.
permissions:
  contents: write
  issues: write

# Never let two runs overlap (e.g. a slow run colliding with the next hour's).
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Without this a hung fetch runs to GitHub's 6-hour cap, then gets
    # cancelled — and a cancelled job is not a "failure", so no alarm fires.
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest numbers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then echo "YouTube API key: present"; else echo "YouTube API key: MISSING - will fall back to scraping"; fi
          python3 update_stats.py

      - name: Commit the update (only if something changed)
        run: |
          git config user.name  "somba-bot"
          git config user.email "actions@github.com"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "No changes this hour."
          else
            git commit -m "Auto stats update $(date -u +'%F %H:%M UTC')"
            git pull --rebase
            git push
          fi

      # Notices when the data has gone quietly stale (updates not landing, or
      # a platform reusing an old number for 3+ days). Doesn't fail the run —
      # that would email the owner every hour — it just arms the alarm below,
      # which only ever opens one issue.
      - name: Check the data is still fresh
        id: health
        run: |
          if OUTPUT=$(python3 update_stats.py --check); then
            echo "$OUTPUT"
            echo "healthy=yes" >> "$GITHUB_OUTPUT"
          else
            echo "$OUTPUT"
            echo "healthy=no" >> "$GITHUB_OUTPUT"
            echo "cause=$(printf '%s' "$OUTPUT" | sed -n 's/^CAUSE://p' | head -1)" >> "$GITHUB_OUTPUT"
            {
              echo "detail<<SOMBA_EOF"
              printf '%s' "$OUTPUT" | sed -n 's/^DETAIL://p' | head -1 | tr '|' '\n'
              echo "SOMBA_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # The alarm: one GitHub issue per KIND of breakage, which emails the
      # owner. Titling every alert the same way meant the first open issue
      # muted every later failure — so the cause goes in the title.
      - name: Raise the alarm if anything above failed
        if: always() && (failure() || cancelled() || steps.health.outputs.healthy == 'no')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CAUSE: ${{ steps.health.outputs.cause }}
          DETAIL: ${{ steps.health.outputs.detail }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$CAUSE" ]; then
            TITLE="Dashboard updater: $CAUSE"
            WHAT="The hourly update ran, but the data is not healthy:

          $DETAIL"
          else
            TITLE="Dashboard updater: run-$JOB_STATUS"
            WHAT="The hourly update itself did not finish (job status: $JOB_STATUS)."
          fi

          OPEN_COUNT=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")
          if [ "$OPEN_COUNT" = "0" ]; then
            gh issue create --title "$TITLE" --body "$WHAT

          What to do: open a Claude Code chat in the somba-dashboard folder and paste this link — it can read the log and fix the reader.

          Run: $RUN_URL

          (Opened automatically. Each kind of problem gets its own issue, so closing this one will not hide a different failure. Close it once fixed.)"
          else
            echo "An issue for '$TITLE' is already open — not creating another."
          fi
